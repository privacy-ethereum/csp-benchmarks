[package]
name = "rookie-numbers"
version = "0.1.0"
edition = "2021"

[lib]

[dependencies]
sha256 = { git = "https://github.com/clementwalter/rookie-numbers", rev = "ec6b9273ac83823dfe45992ce6a2580275ce51e7", default-features = false, features = [
  "parallel",
] }
utils = { path = "../utils" }
bincode = "1.3.3"
clap = { version = "4.5.20", features = ["derive", "env"] }

[[bench]]
name = "sha256"
harness = false

[[bin]]
name = "sha256_mem_rookie_numbers"
path = "src/bin/sha256_mem.rs"
