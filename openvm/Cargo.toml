[package]
name = "openvm"
version = "0.1.0"
edition = "2024"

[dependencies]
ere-openvm = { git = "https://github.com/eth-act/ere", rev = "6573843", default-features = false, features = ["compiler", "zkvm"] }

# Workspace
criterion = { workspace = true }
clap = { workspace = true }
utils = { workspace = true }
ere-zkvm-interface = { workspace = true }
bincode = { workspace = true }
toml = "0.9"

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "private_tx"
harness = false

[[bin]]
name = "sha256_mem_openvm"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "private_tx_mem_openvm"
path = "src/bin/private_tx_mem.rs"
