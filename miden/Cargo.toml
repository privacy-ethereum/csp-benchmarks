[package]
name = "miden"
version = "0.1.0"
edition = "2024"

[dependencies]
ere-miden = { git = "https://github.com/alxkzmn/ere", rev = "e0b4af2" }
bincode = { workspace = true }
k256 = { workspace = true }

# Workspace
criterion = { workspace = true }
clap = { workspace = true }
utils = { workspace = true }
ere-zkvm-interface = { workspace = true }

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "ecdsa"
harness = false

[[bin]]
name = "sha256_mem_miden"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "ecdsa_mem_miden"
path = "src/bin/ecdsa_mem.rs"
