
[workspace]

[package]
name = "stark-v-mobile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["uniffi"]
uniffi = ["mopro-ffi/uniffi"]
wasm = []

[dependencies]
mopro-ffi = { version = "=0.3.6" }
thiserror = "2.0.12"
stark-v-bench = { path = "../../stark-v", package = "stark-v" }
utils = { path = "../../utils" }
