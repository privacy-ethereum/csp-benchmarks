[package]
name = "provekit-groth16-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = { workspace = true }
utils = { workspace = true }
criterion = { workspace = true }
clap = { workspace = true }
ark-serialize = "0.5"
noirc_abi = { git = "https://github.com/noir-lang/noir", rev = "v1.0.0-beta.19" }
provekit-common = { git = "https://github.com/worldfnd/ProveKit", rev = "622c276fdea28c3c020705e2df71d20870f415ce" }
provekit-r1cs-compiler = { git = "https://github.com/worldfnd/ProveKit", rev = "622c276fdea28c3c020705e2df71d20870f415ce" }
provekit-prover = { git = "https://github.com/worldfnd/ProveKit", rev = "622c276fdea28c3c020705e2df71d20870f415ce" }
provekit-verifier = { git = "https://github.com/worldfnd/ProveKit", rev = "622c276fdea28c3c020705e2df71d20870f415ce" }
provekit-groth16 = { git = "https://github.com/worldfnd/ProveKit", rev = "622c276fdea28c3c020705e2df71d20870f415ce" }

[[bin]]
name = "sha256_mem_provekit_groth16"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "ecdsa_mem_provekit_groth16"
path = "src/bin/ecdsa_mem.rs"

[[bin]]
name = "poseidon_mem_provekit_groth16"
path = "src/bin/poseidon_mem.rs"

[[bin]]
name = "keccak_mem_provekit_groth16"
path = "src/bin/keccak_mem.rs"

[[bin]]
name = "poseidon2_mem_provekit_groth16"
path = "src/bin/poseidon2_mem.rs"

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "ecdsa"
harness = false

[[bench]]
name = "poseidon"
harness = false

[[bench]]
name = "poseidon2"
harness = false

[[bench]]
name = "keccak"
harness = false
