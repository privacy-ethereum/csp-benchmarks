name: Lints

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  EXCLUDED_CRATES: "binius64 nexus cairo-m stark-v"
  GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}

# ────────────────── 1. Warm‑up build ──────────────────
jobs:
  fmt:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache everything
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup
            target
            binius64/target
            nexus/target
            cairo-m/target
            rookie-numbers/target
            stark-v/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-03-04
          override: true
          profile: default
          default: true
          components: rustfmt, clippy

      - name: Install Binius toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.95.0
          profile: minimal
          components: rustfmt, clippy

      - name: Install excluded crates toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-04-06
          profile: minimal
          components: llvm-tools, rustc-dev, rust-src, rustfmt, clippy

      - name: Install OpenMPI
        uses: ./.github/actions/install-ompi

      - name: Install LLVM and LLD for cairo-m
        uses: ./.github/actions/install-llvm

      - name: Install protobuf
        uses: ./.github/actions/install-protobuf

      - name: Install circom
        uses: ./.github/actions/install-circom

      # Restored with its mtime, so a warm cache does not recompile the 57 MiB of
      # generated C++ that circom/build.rs produces for the ECDSA circuit.
      - name: Cache the ECDSA witness generator
        uses: actions/cache@v4
        with:
          # Only the two generated files: the same directory also holds the
          # downloaded .zkey, which must not be cached or restored over.
          path: |
            circom/circuits/ecdsa/ecdsa_32/ecdsa_32.cpp
            circom/circuits/ecdsa/ecdsa_32/ecdsa_32.dat
          key: ${{ runner.os }}-ecdsa-witness-${{ hashFiles('circom/circuits/ecdsa/**/*.circom') }}

      - name: Build full workspace
        run: cargo build --workspace

      - name: Build excluded crates
        run: |
          for crate in $EXCLUDED_CRATES; do
            cd "$crate" && cargo build && cd ..
          done

      - name: Format
        run: cargo fmt --all -- --check

      - name: Format excluded crates
        run: |
          for crate in $EXCLUDED_CRATES; do
            cd "$crate" && cargo fmt --all -- --check && cd ..
          done

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Clippy excluded crates
        run: |
          for crate in $EXCLUDED_CRATES; do
            cd "$crate" && cargo clippy --all-targets --all-features && cd ..
          done
