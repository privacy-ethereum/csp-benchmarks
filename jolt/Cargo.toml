[package]
name = "jolt"
version = "0.1.0"
edition = "2024"

[dependencies]
ere-jolt = { git = "https://github.com/eth-act/ere", rev = "6573843" }
jolt-inlines-blake3 = { git = "https://github.com/a16z/jolt", rev = "2e05fe88", features = ["host"] }
postcard = { version = "1.0", features = ["alloc"] }

# Workspace
criterion = { workspace = true }
clap = { workspace = true }
ere-zkvm-interface = { workspace = true }
serde = { workspace = true }
utils = { workspace = true }

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "keccak"
harness = false

[[bench]]
name = "ecdsa"
harness = false

[[bench]]
name = "private_tx"
harness = false

[[bench]]
name = "constant_overhead"
harness = false

[[bench]]
name = "merkle_fake"
harness = false

[[bench]]
name = "hash_sha256"
harness = false

[[bench]]
name = "merkle_sha256"
harness = false

[[bench]]
name = "hash_keccak"
harness = false

[[bench]]
name = "merkle_keccak"
harness = false

[[bench]]
name = "hash_blake3"
harness = false

[[bench]]
name = "merkle_blake3"
harness = false

[[bin]]
name = "sha256_mem_jolt"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "keccak_mem_jolt"
