[package]
name = "jolt-ecdsa"
version = "0.1.0"
edition = "2021"

[dependencies]
ere-platform-jolt = { git = "https://github.com/alxkzmn/ere", features = ["guest-std"] }
jolt-inlines-secp256k1 = { git = "https://github.com/a16z/jolt", rev = "35d46f5" }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[features]
default = ["guest"]
guest = []

[workspace]
