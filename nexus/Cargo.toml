[package]
name = "nexus"
version = "0.1.0"
edition = "2024"

[dependencies]
zmij = "=1.0.0"
ere-nexus = { git = "https://github.com/alxkzmn/ere", rev = "e0b4af2" }
ere-zkvm-interface = { git = "https://github.com/alxkzmn/ere", rev = "e0b4af2" }
criterion = "0.5"
clap = { version = "4.5", features = ["derive", "env"] }
utils = { path = "../utils" }

[[bench]]
name = "sha256"
harness = false

[[bin]]
name = "sha256_mem_nexus"
path = "src/bin/sha256_mem.rs"
