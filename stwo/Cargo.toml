[package]
name = "stwo-bench"
version = "0.1.0"
edition = "2021"

[lib]

[dependencies]
anyhow = { workspace = true }
bincode = { workspace = true }
clap = { workspace = true }
criterion = { workspace = true }
utils = { workspace = true }
serde = { workspace = true }

# Stwo dependencies from rookie-numbers (using re-exports to avoid version conflicts)
sha256 = { git = "https://github.com/clementwalter/rookie-numbers", rev = "86246f0", default-features = false, features = ["parallel"] }

[[bench]]
name = "sha256"
harness = false

[[bin]]
name = "sha256_mem_stwo"
path = "src/bin/sha256_mem.rs"
